<text x="760" y="902.2" fill="#cfd5e0" font-size="16" text-anchor="middle" font-weight="600">LADO</text>
<text x="842.8" y="856" fill="#7d8594" font-size="12">pé ≈ 1,1 cab</text>
<text x="1130" y="110" fill="#f2f2f2" font-size="17" font-weight="600">Comprimentos</text>
<text x="1130" y="140" fill="#cfd5e0" font-size="14">braço (ombro→cotovelo)</text>
<text x="1385" y="140" fill="#ffb347" font-size="14" text-anchor="end">1.50 cab</text>
<text x="1130" y="166" fill="#cfd5e0" font-size="14">antebraço (cotovelo→punho)</text>
<text x="1385" y="166" fill="#ffb347" font-size="14" text-anchor="end">1.25 cab</text>
<text x="1130" y="192" fill="#cfd5e0" font-size="14">mão</text>
<text x="1385" y="192" fill="#ffb347" font-size="14" text-anchor="end">0.75 cab</text>
<text x="1130" y="218" fill="#cfd5e0" font-size="14">coxa (quadril→joelho)</text>
<text x="1385" y="218" fill="#ffb347" font-size="14" text-anchor="end">2.00 cab</text>
<text x="1130" y="244" fill="#cfd5e0" font-size="14">canela (joelho→tornozelo)</text>
<text x="1385" y="244" fill="#ffb347" font-size="14" text-anchor="end">1.85 cab</text>
<text x="1130" y="270" fill="#cfd5e0" font-size="14">pescoço</text>
<text x="1385" y="270" fill="#ffb347" font-size="14" text-anchor="end">0.35 cab</text>
<text x="1130" y="320" fill="#f2f2f2" font-size="17" font-weight="600">Regras de conferência</text>
<text x="1130" y="350" fill="#a9b0bd" font-size="14">• cotovelo na altura do umbigo</text>
<text x="1130" y="374" fill="#a9b0bd" font-size="14">• punho na altura da virilha</text>
<text x="1130" y="398" fill="#a9b0bd" font-size="14">• ponta dos dedos no meio da coxa</text>
<text x="1130" y="422" fill="#a9b0bd" font-size="14">• metade da altura = virilha</text>
<text x="1130" y="446" fill="#a9b0bd" font-size="14">• joelho a 2 cabeças do chão</text>
<text x="1130" y="470" fill="#a9b0bd" font-size="14">• ombros: 1,5–1,6 cab (fem.)</text>
<text x="1130" y="494" fill="#a9b0bd" font-size="14">                1,8–2,0 cab (masc.)</text>
<text x="1130" y="560" fill="#f2f2f2" font-size="17" font-weight="600">Hoje (medido)</text>
<text x="1130" y="586" fill="#7d8594" font-size="12">medida</text>
<text x="1300" y="586" fill="#7d8594" font-size="12" text-anchor="end">esboço</text>
<text x="1385" y="586" fill="#7d8594" font-size="12" text-anchor="end">atual</text>
<text x="1130" y="610" fill="#cfd5e0" font-size="13">altura em cabeças</text>
<text x="1300" y="610" fill="#ffb347" font-size="13" text-anchor="end">8</text>
<text x="1385" y="610" fill="#ff7b7b" font-size="13" text-anchor="end">≈6,5 (rig)</text>
<text x="1130" y="634" fill="#cfd5e0" font-size="13">ombros</text>
<text x="1300" y="634" fill="#ffb347" font-size="13" text-anchor="end">1,55</text>
<text x="1385" y="634" fill="#ff7b7b" font-size="13" text-anchor="end">2,5 (rig)</text>
<text x="1130" y="658" fill="#cfd5e0" font-size="13">braço até o punho</text>
<text x="1300" y="658" fill="#ffb347" font-size="13" text-anchor="end">2,75</text>
<text x="1385" y="658" fill="#ff7b7b" font-size="13" text-anchor="end">1,6 (elfa*)</text>
<text x="1130" y="682" fill="#cfd5e0" font-size="13">coxa</text>
<text x="1300" y="682" fill="#ffb347" font-size="13" text-anchor="end">2,0</text>
<text x="1385" y="682" fill="#ff7b7b" font-size="13" text-anchor="end">1,9 (rig)</text>
<text x="1130" y="720" fill="#a9b0bd" font-size="12">* detecção errou: marcou o cotovelo</text>
<text x="1130" y="738" fill="#a9b0bd" font-size="12">  como punho; o rig esticou o braço.</text>
